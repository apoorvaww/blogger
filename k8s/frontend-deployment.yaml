apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogger-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blogger-frontend
  template:
    metadata:
      labels:
        app: blogger-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-username/blogger-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: blogger-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
